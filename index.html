<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flow Field — Quartz Zenith</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>≋ flow field — quartz zenith</h1><nav class="lang"><button data-lang="en" class="on">EN</button><button data-lang="de">DE</button></nav></header>
<main><aside class="panel">
<section><h2 data-i="controls">Controls</h2><div class="btncol">
<button id="regen" class="primary" data-i="regen">↻ Regenerate</button>
<button id="png" data-i="png">⤓ Export PNG</button></div></section>
<section><h2 data-i="params">Parameters</h2>
<label><span data-i="mode">Field mode</span><select id="mode"><option value="flow">flow</option><option value="vortex">vortex</option><option value="spiral">spiral</option><option value="noise">noise</option></select></label>
<label><span data-i="particles">Particles</span><input type="range" id="parts" min="200" max="4000" step="100" value="1880"></label>
<label><span data-i="speed">Speed</span><input type="range" id="speed" min="0.2" max="3" step="0.1" value="1.5"></label>
<label><span data-i="scale">Field scale</span><input type="range" id="scale" min="0.5" max="4" step="0.1" value="1.6"></label>
<label><span data-i="fade">Trail fade</span><input type="range" id="fade" min="0.005" max="0.2" step="0.005" value="0.03"></label></section>
<section><h2 data-i="palette">Palette</h2><div class="btncol" id="pals"></div></section>
<section><h2 data-i="seed">Seed</h2><div class="seedrow"><input type="number" id="seed" value="38143"><button id="dice">⚄</button></div></section>
</aside><div class="stage"><canvas id="cv"></canvas></div></main>
<script src="app.js"></script></body></html>
